<!DOCTYPE html>
<html>
<head><title>Bookstore Login</title></head>
<body style="background-color: bisque; font-family: sans-serif; padding: 30px; text-align: center;">
    <h2>Account Login</h2>
    <form action="index.html" style="display: inline-block; background: white; padding: 20px; border-radius: 5px;">
        <label>Username:</label><br>
        <input type="text" placeholder="Enter Username" required><br><br>
        <label>Password:</label><br>
        <input type="password" placeholder="Enter Password" required><br><br>
        <input type="submit" value="Login" style="background-color: chocolate; color: white; border: none; padding: 5px 15px; cursor: pointer;"><br><br>
        <a href="index.html" style="color: black; text-decoration: none; font-size: 0.9rem;">← Back to Home</a>
    </form>
</body>
</html>
