<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <style>
        body { background-color: bisque; font-family: sans-serif; text-align: center; padding: 20px; }
        form { display: inline-block; background: white; padding: 20px; border-radius: 8px; text-align: left; }
        input { margin: 5px 0 12px; padding: 6px; width: 200px; display: block; }
        input[type="submit"] { background: chocolate; color: white; border: none; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <h2 style="color: chocolate;">Registration</h2>
    <form action="login.html">
        <label>Name:</label>
        <input type="text" placeholder="Enter Name" required>
        <label>Email:</label>
        <input type="email" placeholder="Enter Email" required>
        <label>Password:</label>
        <input type="password" placeholder="Enter Password" required>
        <input type="submit" value="Register">
        <p align="center"><a href="login.html" style="color: black;">Login here</a></p>
    </form>
</body>
</html>
