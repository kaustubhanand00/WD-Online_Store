<!DOCTYPE html>
<html>
<head>
    <title>Catalogue</title>
    <style>
        body { background-color: bisque; font-family: sans-serif; padding: 20px; }
        h2 { color: chocolate; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: chocolate; color: white; }
        button { background: chocolate; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Book Catalogue</h2>
    <table>
        <tr>
            <th>Book Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        <tr>
            <td>Programming in C</td>
            <td>Balagurusamy</td>
            <td>Rs. 350</td>
            <td><button onclick="alert('Added!')">Add to Cart</button></td>
        </tr>
        <tr>
            <td>Engineering Mathematics</td>
            <td>B.S. Grewal</td>
            <td>Rs. 450</td>
            <td><button onclick="alert('Added!')">Add to Cart</button></td>
        </tr>
    </table>
</body>
</html>
