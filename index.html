<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store</title>
    <style>
        .header {
            background-color: chocolate;
            height: 60px;
            display: flex;
            align-items: center;
        }
        .logo {
            width: 15%;
            text-align: center;
        }
        .logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }
        .webname {
            flex: 1;
            text-align: center;
            color: white;
            font-family: sans-serif;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .menu {
            background-color: antiquewhite;
            height: 50px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .menu a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            font-family: sans-serif;
        }
        .menu a:hover {
            color: chocolate;
        }
        .main {
            display: flex;
            height: 400px;
            background-color: bisque;
        }
        .left {
            width: 10%;
            text-align: left;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
        }
        .left a {
            text-decoration: none;
            font-size: 22px;
            line-height: 2;
            font-family: sans-serif;
            color: black;
            padding-left: 10px;
        }
        .left a:hover {
            color: chocolate;
            background-color: rgba(210,105,30,0.1);
        }
        .right {
            flex: 1;
            border: 1px solid black;
        }
        .right iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="https://www.glbitm.org/images/logo-2.png" alt="coll. logo">
        </div>
        <div class="webname">
            ONLINE BOOK STORE
        </div>
    </div>
    <div class="menu">
        <a href="home.html" target="content">HOME</a>
        <a href="login.html">LOGIN</a>
        <a href="reg.html">REGISTRATION</a>
        <a href="catalogue.html">CATALOGUE</a>
        <a href="Cart.html">CART</a>
    </div>
    <div class="main">
        <div class="left">
            <p>
                <a href="cse.html" target="content">CSE</a><br>
                <a href="EC.html" target="content">ECE</a><br>
                <a href="Mech.html" target="content">Mech</a><br>
                <a href="Maths.html" target="content">Maths</a>
            </p>
        </div>
        <div class="right">
            <iframe src="home.html" name="content"></iframe>
        </div>
    </div>
</body>
</html>
